[workspace]
resolver = "2"
members = [
    "keyline",           # Main application binary
    "keyline-core",      # Core library functionality
    "keyline-config",    # Configuration handling
    "keyline-ui",        # UI components
    "keyline-commands",  # Command processing
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Keyline Contributors"]
license = "MIT"
repository = "https://github.com/yourusername/keyline"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"

# UI dependencies
iced = { version = "0.10", features = ["tokio", "debug"] }
iced_native = "0.10"
iced_style = "0.9"

# Windows-specific
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# Testing
test-case = "3.3"
mockall = "0.12"
