# Schema for individual command configuration files

# Command schema version
version = "1.0"

# Top-level command properties
name = { type = "string", required = true, pattern = "^[a-z0-9-]+$" }
description = { type = "string", required = true, min_length = 1, max_length = 100 }
executable = { type = "string", required = true }
icon = { type = "string", required = true, pattern = "^[\\p{Emoji_Presentation}]$" }

# Permissions table
[permissions]
elevation = { type = "string", required = true, values = ["user", "admin", "system"] }
requires_confirmation = { type = "boolean", required = true }

# Validation table  
[validation]
timeout = { type = "integer", required = true, min = 1000, max = 300000 }

# Optional arguments
[arguments]
type = "array"
items = { type = "string" }
required = false

# Optional environment variables
[environment]
type = "table"
required = false
key_pattern = "^[A-Z_][A-Z0-9_]*$"
value_type = "string"

# Optional working directory
[working_directory]
type = "string" 
required = false

# Optional resource limits
[limits]
cpu_percent = { type = "integer", min = 1, max = 100 }
memory_mb = { type = "integer", min = 1 }
file_handles = { type = "integer", min = 1 }
child_processes = { type = "integer", min = 0 }
