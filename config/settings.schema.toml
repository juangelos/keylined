# Schema for settings configuration file

# Settings schema version
version = "1.0"

# Schema definition
[schema]
type = "object"

[[schema.fields]]
name = "ui"
type = "table"

[[schema.fields.fields]]
name = "font_size"
type = "integer"
default = 36
min = 8
max = 72

[[schema.fields.fields]]
name = "font_family"
type = "string"
default = "Segoe UI"

[[schema.fields.fields]]
name = "font_weight"
type = "string"
default = "normal"
allowed = ["normal", "bold"]

[[schema.fields.fields]]
name = "line_height"
type = "float"
default = 1.2
min = 1.0
max = 2.0

[[schema.fields.fields]]
name = "border_color"
type = "string"
pattern = "^#[0-9A-Fa-f]{6}$"

[[schema.fields.fields]]
name = "background_color"
type = "string"
pattern = "^#[0-9A-Fa-f]{6}$"

[[schema.fields.fields]]
name = "text_color"
type = "string"
pattern = "^#[0-9A-Fa-f]{6}$"

[[schema.fields]]
name = "behavior"
type = "table"

[[schema.fields.fields]]
name = "edit_mode"
type = "string"
default = "windows"
allowed = ["windows", "emacs"]

[[schema.fields.fields]]
name = "error_display"
type = "string"
default = "blink"
allowed = ["blink", "stay"]

[[schema.fields.fields]]
name = "error_timeout"
type = "integer"
default = 2000
min = 500
max = 10000

[[schema.fields.fields]]
name = "auto_hide"
type = "boolean"
default = true

[[schema.fields]]
name = "shortcuts"
type = "table"

[[schema.fields.fields]]
name = "activate"
type = "string"
default = "Alt+Space"

[[schema.fields.fields]]
name = "expand"
type = "string"
default = "Alt+Enter"

[[schema.fields]]
name = "voice"
type = "table"

[[schema.fields.fields]]
name = "wake_word"
type = "string"
default = "hey keyline"

[[schema.fields.fields]]
name = "recognition_mode"
type = "string"
default = "cloud"
allowed = ["cloud", "local", "hybrid"]

[[schema.fields.fields]]
name = "sensitivity"
type = "float"
default = 0.5
min = 0.0
max = 1.0
